<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>تجربة سلايد جيش المقاليع</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: var(--tg-theme-bg-color, #0e1621);
      --surface: var(--tg-theme-secondary-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --muted: var(--tg-theme-hint-color, #8d9baa);
      --accent: var(--tg-theme-button-color, #2aabee);
      --accent-text: var(--tg-theme-button-text-color, #fff);
      --line: color-mix(in srgb, var(--muted) 35%, transparent);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      padding: 10px 10px 86px;
    }
    header { margin-bottom: 9px; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .target { color: var(--muted); font-size: 12px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 10px;
      margin-bottom: 7px;
    }
    .row-head, .value-line, .step-row, .switch-row, .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .name { font-size: 14px; font-weight: 700; }
    .available, .hint { color: var(--muted); font-size: 11px; }
    .selected { color: var(--accent); font-size: 13px; font-weight: 700; direction: ltr; }
    input[type="range"] {
      width: 100%;
      height: 24px;
      margin: 4px 0 2px;
      accent-color: var(--accent);
    }
    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 7px;
      min-height: 30px;
      font-size: 12px;
      font: inherit;
      cursor: pointer;
    }
    button:active { transform: scale(.98); }
    .preset.active { border-color: var(--accent); color: var(--accent); }
    .stepper { display: flex; align-items: center; gap: 8px; direction: ltr; }
    .stepper button { width: 34px; min-height: 32px; font-size: 18px; }
    .stepper strong { min-width: 28px; text-align: center; font-size: 17px; }
    .switch {
      width: 42px;
      height: 23px;
      border-radius: 20px;
      background: var(--muted);
      position: relative;
      direction: ltr;
    }
    .switch input { display: none; }
    .switch span {
      position: absolute;
      width: 19px;
      height: 19px;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: white;
      transition: .18s;
    }
    .switch:has(input:checked) { background: var(--accent); }
    .switch input:checked + span { left: 21px; }
    .summary { margin-top: 6px; color: var(--muted); font-size: 11px; }
    footer {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 7px;
      padding: 8px 10px max(8px, env(safe-area-inset-bottom));
      background: var(--bg);
      border-top: 1px solid var(--line);
    }
    footer button { min-height: 40px; font-size: 14px; font-weight: 700; }
    .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 9px 15px;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">إعداد جيش المقاليع</h1>
    <div class="target" id="target"></div>
  </header>

  <main id="troops"></main>

  <section class="card">
    <div class="step-row">
      <div>
        <div class="name">عدد الموجات</div>
        <div class="hint" id="wavesHint">الحد الأعلى 30</div>
      </div>
      <div class="stepper">
        <button type="button" id="minus">−</button>
        <strong id="waves">1</strong>
        <button type="button" id="plus">+</button>
      </div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:8px 0">
    <div class="switch-row">
      <div>
        <div class="name">البطل في الموجة الأولى</div>
        <div class="hint">يُستخدم مرة واحدة فقط</div>
      </div>
      <label class="switch">
        <input id="hero" type="checkbox">
        <span></span>
      </label>
    </div>
    <div class="summary">
      <span>إجمالي المقاليع</span>
      <strong id="catTotal">0</strong>
    </div>
  </section>

  <footer>
    <button type="button" id="cancel">إلغاء</button>
    <button type="button" class="primary" id="approve">اعتماد الإعداد</button>
  </footer>
  <div class="toast" id="toast">تم اعتماد الإعداد</div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    function readConfig() {
      const encoded = new URLSearchParams(location.search).get('d');
      if (!encoded) return null;
      try {
        const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/')
          + '='.repeat((4 - encoded.length % 4) % 4);
        const bytes = Uint8Array.from(atob(base64), char => char.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      } catch {
        return null;
      }
    }

    const config = readConfig() || {
      kind: 'catapult_config',
      sid: 's4',
      nonce: 'demo',
      target: 'قرية 3 (-52,-40)',
      waves: 21,
      maximumWaves: 30,
      hero: true,
      heroAvailable: true,
      troops: [
        { id: 16, name: 'فارس الجرمان', available: 78516371, selected: 77589529, role: 'troop' },
        { id: 17, name: 'محطمة الأبواب', available: 35325208, selected: 2000000, role: 'troop' },
        { id: 18, name: 'مقلاع', available: 20186324, selected: 90000, role: 'catapult' }
      ]
    };
    const state = {
      waves: Math.max(1, Number(config.waves) || 1),
      maximumWaves: Math.max(1, Number(config.maximumWaves) || 30),
      troops: Array.isArray(config.troops) ? config.troops.map(troop => ({
        id: Number(troop.id),
        name: String(troop.name || ''),
        available: Math.max(0, Number(troop.available) || 0),
        selected: Math.max(0, Number(troop.selected) || 0),
        role: troop.role === 'catapult' ? 'catapult' : 'troop'
      })) : []
    };
    state.waves = Math.min(state.maximumWaves, state.waves);

    const format = value => Number(value).toLocaleString('en-US');
    const escapeHtml = value => String(value)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    const container = document.getElementById('troops');
    const hero = document.getElementById('hero');

    document.getElementById('title').textContent =
      `إعداد جيش المقاليع — ${config.sid || ''}`;
    document.getElementById('target').textContent = `الهدف: ${config.target || ''}`;
    document.getElementById('wavesHint').textContent =
      `الحد الأعلى ${state.maximumWaves}`;
    hero.checked = Boolean(config.hero) && Boolean(config.heroAvailable);
    hero.disabled = !config.heroAvailable;

    function maximumFor(troop) {
      return troop.role === 'catapult'
        ? Math.floor(troop.available / state.waves)
        : troop.available;
    }

    function renderTroops() {
      container.innerHTML = state.troops.map(troop => `
        <section class="card" data-id="${troop.id}">
          <div class="row-head">
            <span class="name">${escapeHtml(troop.name)}</span>
            <span class="available">المتوفر ${format(troop.available)}</span>
          </div>
          <input type="range" min="0" max="${maximumFor(troop)}" step="1" value="${Math.min(troop.selected, maximumFor(troop))}">
          <div class="value-line">
            <span class="hint">${troop.role === 'catapult' ? 'لكل موجة' : 'الموجة الأولى'}</span>
            <span class="selected">${format(troop.selected)}</span>
          </div>
          <div class="presets">
            ${[25, 50, 75, 100].map(percent =>
              `<button type="button" class="preset" data-percent="${percent}">${percent === 100 ? 'الكل' : percent + '%'}</button>`
            ).join('')}
          </div>
        </section>
      `).join('');

      for (const card of container.querySelectorAll('.card')) {
        const troop = state.troops.find(item => String(item.id) === card.dataset.id);
        const slider = card.querySelector('input');
        const selected = card.querySelector('.selected');
        slider.addEventListener('input', () => {
          troop.selected = Number(slider.value);
          selected.textContent = format(troop.selected);
          updateSummary();
          tg?.HapticFeedback?.selectionChanged();
        });
        for (const button of card.querySelectorAll('.preset')) {
          button.addEventListener('click', () => {
            troop.selected = Math.floor(maximumFor(troop) * Number(button.dataset.percent) / 100);
            slider.value = troop.selected;
            selected.textContent = format(troop.selected);
            card.querySelectorAll('.preset').forEach(item => item.classList.remove('active'));
            button.classList.add('active');
            updateSummary();
            tg?.HapticFeedback?.impactOccurred('light');
          });
        }
      }
    }

    function updateSummary() {
      document.getElementById('waves').textContent = state.waves;
      const catsTroop = state.troops.find(troop => troop.role === 'catapult');
      const cats = catsTroop?.selected || 0;
      document.getElementById('catTotal').textContent = format(cats * state.waves);
      for (const card of container.querySelectorAll('.card')) {
        const troop = state.troops.find(item => String(item.id) === card.dataset.id);
        if (!troop) continue;
        const slider = card.querySelector('input');
        slider.max = maximumFor(troop);
        if (troop.selected > Number(slider.max)) {
          troop.selected = Number(slider.max);
          slider.value = troop.selected;
          card.querySelector('.selected').textContent = format(troop.selected);
        }
      }
    }

    document.getElementById('minus').addEventListener('click', () => {
      state.waves = Math.max(1, state.waves - 1);
      updateSummary();
    });
    document.getElementById('plus').addEventListener('click', () => {
      state.waves = Math.min(state.maximumWaves, state.waves + 1);
      updateSummary();
    });
    document.getElementById('cancel').addEventListener('click', () => tg?.close());
    document.getElementById('approve').addEventListener('click', () => {
      const cats = state.troops.find(troop => troop.role === 'catapult');
      if (!cats || cats.selected < 1) {
        tg?.showAlert?.('اختر عدد المقاليع لكل موجة.');
        return;
      }
      tg?.HapticFeedback?.notificationOccurred('success');
      const payload = JSON.stringify({
        kind: 'catapult_config',
        sid: config.sid,
        nonce: config.nonce,
        waves: state.waves,
        hero: hero.checked,
        troops: state.troops.map(troop => ({
          id: troop.id,
          selected: troop.selected
        }))
      });
      if (tg?.sendData) {
        tg.sendData(payload);
      } else {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      }
    });

    renderTroops();
    updateSummary();
  </script>
</body>
</html>
